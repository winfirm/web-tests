
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>EURUSD H1 Candles — lightweight-charts demo</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html,body { height:100%; margin:0; font-family: Arial, sans-serif; background:#f5f6f8; }
    #wrapper { display:flex; flex-direction:column; height:100vh; padding:12px; box-sizing:border-box; gap:8px; }
    #controls { display:flex; gap:8px; align-items:center; }
    #chart { flex:1; min-height:300px; background:#fff; border-radius:6px; box-shadow: 0 2px 8px rgba(20,20,30,0.06); padding:8px; }
    button { padding:6px 10px; border-radius:6px; border:1px solid #d0d6df; background:#fff; cursor:pointer; }
    button:active { transform:translateY(1px); }
    .status { color:#666; font-size:13px; }
  </style>
</head>
<body>
  <div id="wrapper">
    <div id="controls">
      <button id="reloadBtn">Reload data</button>
      <button id="toggleDrawBtn">Toggle drawing (if available)</button>
      <div class="status" id="status">Loading…</div>
    </div>
    <div id="chart"></div>
  </div>

  <script type="module">
    // Using ESM shims — modern browsers only
    import { createChart, CrosshairMode } from 'https://esm.sh/lightweight-charts@4.4.0';
    // Attempt to import the drawing plugin; it's optional and may not exist on the CDN or have different API.
    let DrawingPlugin = null;
    try {
      DrawingPlugin = await import('https://esm.sh/lightweight-charts-drawing@0.0.12').then(m => m.default ?? m);
    } catch (err) {
      // plugin not found or import failed — we'll continue without it.
      console.warn('lightweight-charts-drawing import failed:', err);
      DrawingPlugin = null;
    }

    const DATA_URL = 'https://chart.winfirm.com.cn/datas/klines/query?symbol=EURUSD&times=H1&counts=30';
    const chartContainer = document.getElementById('chart');
    const statusEl = document.getElementById('status');
    const reloadBtn = document.getElementById('reloadBtn');
    const toggleDrawBtn = document.getElementById('toggleDrawBtn');

    // Create chart
    const chart = createChart(chartContainer, {
      width: chartContainer.clientWidth,
      height: chartContainer.clientHeight,
      layout: { backgroundColor: '#fff', textColor: '#222' },
      rightPriceScale: { visible: true },
      timeScale: { timeVisible: true, secondsVisible: false },
      handleScroll: { mouseWheel: true, pressedMouseMove: true },
      crosshair: { mode: CrosshairMode.Normal },
    });

    // make chart resize with window
    new ResizeObserver(entries => {
      for (let entry of entries) {
        chart.applyOptions({ width: Math.floor(entry.contentRect.width), height: Math.floor(entry.contentRect.height) });
      }
    }).observe(chartContainer);

    const candleSeries = chart.addCandlestickSeries({
      upColor: '#26a69a',
      downColor: '#ef5350',
      wickUpColor: '#26a69a',
      wickDownColor: '#ef5350',
      borderVisible: false,
    });

    // optional drawing plugin instance
    let drawingInstance = null;
    async function initDrawingPluginIfAvailable() {
      if (!DrawingPlugin) {
        console.info('Drawing plugin not available');
        return;
      }
      try {
        // Different drawing plugin implementations expect different init calls.
        // Try some common patterns gracefully.
        if (typeof DrawingPlugin === 'function') {
          // If plugin exports an init function that accepts chart
          drawingInstance = await DrawingPlugin(chart);
        } else if (DrawingPlugin && typeof DrawingPlugin.create === 'function') {
          drawingInstance = await DrawingPlugin.create(chart);
        } else if (DrawingPlugin && typeof DrawingPlugin.default === 'function') {
          drawingInstance = await DrawingPlugin.default(chart);
        } else {
          // unknown API shape — just keep a reference
          drawingInstance = DrawingPlugin;
        }
        console.info('Drawing plugin initialized', drawingInstance);
      } catch (err) {
        console.warn('Failed to initialize drawing plugin:', err);
        drawingInstance = null;
      }
    }

    // Convert the API data entry to lightweight-charts candlestick point
    function convertEntryToCandle(entry) {
      // Common server formats:
      // 1) Array: [time, open, high, low, close, ...]
      // 2) Object: { t: timestamp, o, h, l, c } or { time, open, high, low, close }
      if (Array.isArray(entry)) {
        const ts = Number(entry[0]);
        const open = Number(entry[1]);
        const high = Number(entry[2]);
        const low = Number(entry[3]);
        const close = Number(entry[4]);
        // Convert ms -> seconds if necessary
        const time = ts > 1e12 ? Math.floor(ts / 1000) : ts;
        return { time, open, high, low, close };
      } else if (entry !== null && typeof entry === 'object') {
        // prefer common keys
        const rawTime = entry.t ?? entry.time ?? entry[0] ?? entry.timestamp ?? entry[ '0' ];
        const open = Number(entry.o ?? entry.open ?? entry[1]);
        const high = Number(entry.h ?? entry.high ?? entry[2]);
        const low = Number(entry.l ?? entry.low ?? entry[3]);
        const close = Number(entry.c ?? entry.close ?? entry[4]);
        let time = rawTime;
        if (typeof time === 'string') {
          // try to parse ISO time
          const d = Date.parse(time);
          if (!Number.isNaN(d)) time = Math.floor(d / 1000);
        } else if (typeof time === 'number') {
          if (time > 1e12) time = Math.floor(time / 1000); // ms -> s
        }
        return { time, open, high, low, close };
      } else {
        return null;
      }
    }

    async function loadAndApplyData() {
      statusEl.textContent = 'Fetching data…';
      try {
        const resp = await fetch(DATA_URL, { cache: 'no-store' ,'Authorization':'Basic dHJhZGluZ2JvdDpBcHNkV1hxZmtnbGRmcXE='});
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const j = await resp.json();

        // find the H1 array in the result
        let rawData = null;
        // prefer result.H1 per your instruction
        if (j && j.result && j.result.H1) {
          rawData = j.result.H1;
        } else if (j && j.result) {
          // maybe keys are lowercase or differently named
          const keys = Object.keys(j.result);
          const hKey = keys.find(k => k.toLowerCase() === 'h1' || k.toLowerCase().includes('h'));
          if (hKey) rawData = j.result[hKey];
        } else if (j && Array.isArray(j)) {
          rawData = j;
        } else if (j && j.data) {
          rawData = j.data;
        } else {
          throw new Error('Unexpected response shape — cannot find kline array in JSON');
        }

        if (!Array.isArray(rawData)) {
          throw new Error('Kline data is not an array');
        }

        const candles = rawData
          .map(convertEntryToCandle)
          .filter(Boolean)
          // lightweight-charts expects time ascending
          .sort((a, b) => (a.time - b.time));

        if (candles.length === 0) throw new Error('No candles after parsing');

        candleSeries.setData(candles);
        // zoom to fit
        chart.timeScale().fitContent();

        statusEl.textContent = `Loaded ${candles.length} candles (H1)`;
      } catch (err) {
        console.error(err);
        statusEl.textContent = 'Failed to load data: ' + (err.message || err);
      }
    }

    reloadBtn.addEventListener('click', async () => {
      await loadAndApplyData();
    });

    let drawingEnabled = false;
    toggleDrawBtn.addEventListener('click', async () => {
      if (!drawingInstance) {
        // try to init on demand
        await initDrawingPluginIfAvailable();
      }
      if (!drawingInstance) {
        statusEl.textContent = 'Drawing plugin not available';
        return;
      }
      // Now try to enable/disable drawing depending on plugin API
      try {
        drawingEnabled = !drawingEnabled;
        // Common possibilities:
        if (drawingInstance.enable) {
          drawingInstance[drawingEnabled ? 'enable' : 'disable']();
        } else if (drawingInstance.setEnabled) {
          drawingInstance.setEnabled(drawingEnabled);
        } else if (typeof drawingInstance === 'function') {
          // maybe plugin returns a function to toggle
          drawingInstance(drawingEnabled);
        } else {
          console.info('No toggle API detected on drawing plugin; leaving as initialized.');
        }
        toggleDrawBtn.textContent = drawingEnabled ? 'Disable drawing' : 'Enable drawing';
        statusEl.textContent = drawingEnabled ? 'Drawing enabled' : 'Drawing disabled';
      } catch (err) {
        console.warn('Error toggling drawing plugin:', err);
        statusEl.textContent = 'Error toggling drawing plugin';
      }
    });

    // Initialize
    await initDrawingPluginIfAvailable();
    await loadAndApplyData();
  </script>
</body>
</html>
