<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>Price Action · H1/M5</title>
<style>
:root{
  --bg:#0b0e14; --panel:#11151d; --line:rgba(148,163,184,.14);
  --text:#e2e8f0; --dim:#8b949e; --up:#ef5350; --down:#26a69a; --acc:#3b82f6;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font:14px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;
}
#app{display:flex;flex-direction:column;height:100dvh;min-height:0}
header{flex:none;padding:8px 10px 6px;border-bottom:1px solid var(--line);background:var(--panel)}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.brand{font-weight:700;font-size:16px;letter-spacing:.5px}
.brand span{color:var(--dim);font-size:11px;font-weight:500;margin-left:6px}
.btns{display:flex;gap:8px}
.icon-btn{
  min-width:34px;height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--line);
  background:#161b24;color:var(--text);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.icon-btn:active{transform:scale(.95)}
.icon-btn.off{opacity:.45}
#symbols{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
#symbols::-webkit-scrollbar{display:none}
.sym{
  flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:1px;
  padding:6px 12px;border-radius:10px;border:1px solid var(--line);
  background:transparent;cursor:pointer;min-width:92px;
}
.sym.on{background:var(--acc);border-color:var(--acc)}
.sym .sym-name{font-size:12px;font-weight:700;color:var(--text);letter-spacing:.3px}
.sym .sym-chg{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.sym.on .sym-name{color:#fff}
.sym.on .sym-chg{color:#fff;opacity:.92}
.sym-chg.up{color:var(--up)} .sym-chg.down{color:var(--down)} .sym-chg.flat{color:var(--dim)}
main{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;padding:6px}
.chart-panel{display:flex;flex-direction:column;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.chart-panel.h1{flex:1}
.chart-panel.m5{flex:1}
.chart-head{flex:none;display:flex;align-items:center;gap:10px;padding:5px 10px;font-size:12px;color:var(--dim);border-bottom:1px solid var(--line)}
.tf{font-weight:700;color:var(--text);font-size:12px;white-space:nowrap}
.tf em{font-style:normal;color:var(--acc);margin-left:4px;font-size:10px}
.ohlc{font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ohlc .o{color:var(--dim)} .ohlc .h{color:var(--up)} .ohlc .l{color:var(--down)} .ohlc .c{color:var(--text);font-weight:700}
.ohlc .t{color:var(--dim);font-size:11px;margin-left:4px}
.chart-box{flex:1;min-height:0}
#errbar{flex:none;margin:0 10px 8px;padding:8px 12px;border-radius:8px;background:rgba(239,83,80,.12);border:1px solid rgba(239,83,80,.4);color:#f87171;font-size:12px}
@media (min-width:768px){
  body{max-width:560px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="topbar">
      <div class="brand">Price Action<span>biquote · H1 主 / M5 辅</span></div>
      <div class="btns">
        <button id="btnAuto" class="icon-btn" type="button" title="自动刷新开关">AUTO 5s</button>
        <button id="btnRefresh" class="icon-btn" type="button" title="立即刷新">⟳</button>
      </div>
    </div>
    <div id="symbols"></div>
  </header>
  <main>
    <section class="chart-panel h1">
      <div class="chart-head"><span class="tf">H1<em>主图</em></span><span class="ohlc" id="ohlcH1">--</span></div>
      <div class="chart-box" id="boxH1"></div>
    </section>
    <section class="chart-panel m5">
      <div class="chart-head"><span class="tf">M5<em>辅助</em></span><span class="ohlc" id="ohlcM5">--</span></div>
      <div class="chart-box" id="boxM5"></div>
    </section>
  </main>
  <div id="errbar" hidden></div>
</div>

<script src="https://unpkg.com/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"></script>
<script>
(function(){
'use strict';

/* ============ 页面配置 ============ */
var CONFIG = {
  // 直盘(对美元)为主 + BTCUSD; 如需黄金可加 'XAUUSD'(digits=2)
  symbols: ['EURUSD','GBPUSD','USDJPY','USDCHF','USDCAD','AUDUSD','XAUUSD','BTCUSD'],
  proxyPrefix: 'https://biquote.io',           // 同源代理前缀 → https://biquote.io
  intervals: { main:'1h', aux:'5m' },
  // limit 有效但按区间封顶(实际返回 limit+1 根): 1h 上限 169, 5m 上限 289
  limits: { main:100, aux:144 },
  refreshSec: 5,                // 自动刷新间隔(秒), 0 关闭
  up: '#ef5350',                // 红涨
  down: '#26a69a',              // 绿跌
  // digits 兜底(优先用 /api/symbols 的权威值)
  digitsFallback: { BTCUSD:2, XAUUSD:2, USDJPY:3 }
};

var state = {
  symbol: CONFIG.symbols[0],
  digits: 5,
  digitsMap: {},        // symbol -> digits(来自 /api/symbols)
  quotes: {},           // symbol -> latest 报价
  loading: false,
  timer: null,
  h1bars: [],
  lastH1: null,
  lastM5: null
};

var $ = function(id){ return document.getElementById(id); };
var elSymbols=$('symbols'),
    elOhlcH1=$('ohlcH1'), elOhlcM5=$('ohlcM5'), elErr=$('errbar'),
    btnAuto=$('btnAuto'), btnRefresh=$('btnRefresh');

var LWC = window.LightweightCharts;
if (!LWC) { elErr.textContent='lightweight-charts 加载失败,请检查网络(CDN)'; elErr.hidden=false; return; }

/* ============ 时间格式化(本地时区) ============ */
function pad(n){ return (n<10?'0':'')+n; }
function isoToSec(s){ return Math.floor(Date.parse(s)/1000); }
function fmtTick(t){
  if (typeof t !== 'number') return String(t);
  var d = new Date(t*1000);
  return pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
}
function fmtFull(t){
  if (typeof t !== 'number') return String(t);
  var d = new Date(t*1000);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* ============ 数据访问 ============ */
function api(p){
  return fetch(CONFIG.proxyPrefix + p, { headers:{ Accept:'application/json' } }).then(function(r){
    if (!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  });
}
function fetchQuotes(){
  var q = CONFIG.symbols.map(function(s){ return 'symbols='+encodeURIComponent(s); }).join('&');
  return api('/api/latest?'+q);
}
function fetchOhlc(sym, interval, limit){
  return api('/api/'+encodeURIComponent(sym)+'/ohlc?interval='+encodeURIComponent(interval)+'&limit='+limit);
}
// 一次性拉取品种元数据(拿权威 digits), 失败静默降级
function loadSymbolsMeta(){
  api('/api/symbols').then(function(list){
    var changed = false;
    (list||[]).forEach(function(x){
      if (x && x.name && x.digits != null && state.digitsMap[x.name] == null){
        state.digitsMap[x.name] = x.digits;
        changed = true;
      }
    });
    if (changed && digitsFor(state.symbol) !== state.digits){
      state.digits = digitsFor(state.symbol);
      applyPriceFormat();
    }
  }).catch(function(){});
}
function digitsFor(sym){
  if (state.digitsMap[sym] != null) return state.digitsMap[sym];
  if (CONFIG.digitsFallback[sym] != null) return CONFIG.digitsFallback[sym];
  return 5;
}

/* ============ 图表(lightweight-charts v5) ============ */
function candleOpts(){
  return { upColor:CONFIG.up, downColor:CONFIG.down,
           borderUpColor:CONFIG.up, borderDownColor:CONFIG.down,
           wickUpColor:CONFIG.up, wickDownColor:CONFIG.down };
}
function lineOpts(color, title){
  return { color:color, lineWidth:1, priceLineVisible:false, lastValueVisible:true, crosshairMarkerVisible:false, title:title };
}
var CHART_OPTS = {
  autoSize: true,
  layout: {  attributionLogo:false, background:{ type:'solid', color:'#11151d' }, textColor:'#8b949e', fontSize:11,
            fontFamily:'system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif' },
  grid: { vertLines:{ color:'rgba(148,163,184,0.07)' }, horzLines:{ color:'rgba(148,163,184,0.07)' } },
  rightPriceScale: { borderColor:'rgba(148,163,184,0.2)', scaleMargins:{ top:0.08, bottom:0.08 } },
  timeScale: { borderColor:'rgba(148,163,184,0.2)', timeVisible:true, secondsVisible:false,
               rightOffset:3, barSpacing:6, tickMarkFormatter: fmtTick },
  localization: { timeFormatter: fmtFull,
                  priceFormatter: function(p){ return p == null ? '--' : p.toFixed(state.digits); } },
  crosshair: { mode: LWC.CrosshairMode.Normal }
};
var h1 = LWC.createChart($('boxH1'), CHART_OPTS);
var m5 = LWC.createChart($('boxM5'), CHART_OPTS);
var s1 = h1.addSeries(LWC.CandlestickSeries, candleOpts());
var s2 = m5.addSeries(LWC.CandlestickSeries, candleOpts());
var ema1_20 = h1.addSeries(LWC.LineSeries, lineOpts('#f59e0b', ''));
var ema2_20 = m5.addSeries(LWC.LineSeries, lineOpts('#f59e0b', ''));
var ema2_50 = m5.addSeries(LWC.LineSeries, lineOpts('#a78bfa', ''));

function applyPriceFormat(){
  var d = state.digits;
  var fmt = { type:'price', precision:d, minMove:Math.pow(10, -d) };
  s1.applyOptions({ priceFormat: fmt });
  s2.applyOptions({ priceFormat: fmt });
  var pf = function(p){ return p == null ? '--' : p.toFixed(d); };
  h1.applyOptions({ localization:{ priceFormatter: pf } });
  m5.applyOptions({ localization:{ priceFormatter: pf } });
}

/* ============ 数据 → 图表 ============ */
// biquote bars 按时间倒序(最新在前), 转成升序的 {time, open, high, low, close}
function toBars(resp){
  var bars = (resp && resp.bars) || [];
  var out = [];
  for (var i = bars.length - 1; i >= 0; i--){
    var b = bars[i];
    out.push({ time: isoToSec(b.openTime), open:b.open, high:b.high, low:b.low, close:b.close });
  }
  return out;
}

// 计算 EMA(指数移动平均), 返回 {time, value}[], 首根用收盘价做种子
function calcEma(bars, period){
  var k = 2 / (period + 1);
  var out = [];
  var ema = 0;
  for (var i = 0; i < bars.length; i++){
    ema = i === 0 ? bars[i].close : bars[i].close * k + ema * (1 - k);
    out.push({ time: bars[i].time, value: ema });
  }
  return out;
}

/* ============ 渲染 ============ */
function renderQuotes(q){
  state.quotes = q || {};
  Array.prototype.forEach.call(elSymbols.children, function(node){
    var sym = node.getAttribute('data-sym');
    var qt = state.quotes[sym];
    var chg = node.querySelector('.sym-chg');
    if (qt && qt.mid != null){
      var dp = qt.dayDiffPercent != null ? qt.dayDiffPercent : 0;
      chg.textContent = (dp >= 0 ? '+' : '') + dp.toFixed(2) + '%';
      chg.className = 'sym-chg ' + (dp > 0 ? 'up' : dp < 0 ? 'down' : 'flat');
    }
  });
}

function renderCharts(respMain, respAux, resetView){
  state.digits = digitsFor(state.symbol);
  applyPriceFormat();

  // 保留用户当前缩放(H1); 切换品种时重置视图(fitContent 会应用 rightOffset 留白)。
  // 用 logical range 保留: 时间区间的 setVisibleRange 会丢失 rightOffset 空白,
  // 而 logical range 的 to 端天然包含留白(最后一根 + rightOffset), round-trip 后留白仍在。
  var vr = null;
  if (!resetView) { try { vr = h1.timeScale().getVisibleLogicalRange(); } catch(e){} }

  state.h1bars = toBars(respMain);
  var m5b = toBars(respAux);
  s1.setData(state.h1bars);
  s2.setData(m5b);
  ema1_20.setData(calcEma(state.h1bars, 20));
  ema2_20.setData(calcEma(m5b, 20));
  ema2_50.setData(calcEma(m5b, 50));
  state.lastH1 = state.h1bars.length ? state.h1bars[state.h1bars.length-1] : null;
  state.lastM5 = m5b.length ? m5b[m5b.length-1] : null;

  if (!resetView && vr && vr.from != null && vr.to != null) {
    try { h1.timeScale().setVisibleLogicalRange(vr); } catch(e){}
  } else {
    h1.timeScale().fitContent();
  }

  paintOhlc(elOhlcH1, state.lastH1);
  paintOhlc(elOhlcM5, state.lastM5);
}

function paintOhlc(el, bar){
  if (!bar){ el.textContent='--'; return; }
  var d = state.digits;
  el.innerHTML = 'O <span class="o">'+bar.open.toFixed(d)+'</span>' +
    ' H <span class="h">'+bar.high.toFixed(d)+'</span>' +
    ' L <span class="l">'+bar.low.toFixed(d)+'</span>' +
    ' C <span class="c">'+bar.close.toFixed(d)+'</span>' +
    ' <span class="t">'+fmtFull(bar.time)+'</span>';
}

/* ============ 十字光标 OHLC 读数 ============ */
h1.subscribeCrosshairMove(function(param){
  var bar = (param && param.seriesData) ? param.seriesData.get(s1) : undefined;
  paintOhlc(elOhlcH1, bar || state.lastH1);
});
m5.subscribeCrosshairMove(function(param){
  var bar = (param && param.seriesData) ? param.seriesData.get(s2) : undefined;
  paintOhlc(elOhlcM5, bar || state.lastM5);
});

/* ============ 品种切换 / 刷新 ============ */
function buildTabs(){
  elSymbols.innerHTML = '';
  CONFIG.symbols.forEach(function(sym){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'sym' + (sym === state.symbol ? ' on' : '');
    b.setAttribute('data-sym', sym);
    b.innerHTML = '<span class="sym-name">'+esc(sym)+'</span>' +
                  '<span class="sym-chg flat">--</span>';
    b.addEventListener('click', function(){
      if (sym === state.symbol) return;
      state.symbol = sym;
      Array.prototype.forEach.call(elSymbols.children, function(x){ x.classList.toggle('on', x.getAttribute('data-sym')===sym); });
      load(false, true);
    });
    elSymbols.appendChild(b);
  });
}

function load(silent, resetView){
  if (state.loading) return;
  state.loading = true;
  if (!silent) setErr('');
  var sym = state.symbol;
  var main = CONFIG.intervals.main, aux = CONFIG.intervals.aux;
  Promise.all([
    fetchQuotes(),
    fetchOhlc(sym, main, CONFIG.limits.main),
    fetchOhlc(sym, aux, CONFIG.limits.aux)
  ]).then(function(res){
    renderQuotes(res[0]);
    renderCharts(res[1], res[2], resetView);
  }).catch(function(err){
    setErr(sym+' 加载失败: '+err.message);
  }).then(function(){ state.loading = false; });
}

function setErr(msg){
  if (msg){
    elErr.textContent = msg; elErr.hidden = false;
    clearTimeout(setErr._t);
    setErr._t = setTimeout(function(){ elErr.hidden = true; }, 6000);
  } else { elErr.hidden = true; }
}

/* ============ 自动刷新 ============ */
function setAuto(on){
  if (on && !state.timer){
    state.timer = setInterval(function(){
      if (!document.hidden) load(true);
    }, CONFIG.refreshSec*1000);
  } else if (!on && state.timer){
    clearInterval(state.timer); state.timer = null;
  }
  btnAuto.textContent = on ? 'AUTO '+CONFIG.refreshSec+'s' : 'AUTO OFF';
  btnAuto.classList.toggle('off', !on);
}
btnRefresh.addEventListener('click', function(){ load(false); });
btnAuto.addEventListener('click', function(){ setAuto(CONFIG.refreshSec <= 0); });

/* ============ 启动 ============ */
buildTabs();
applyPriceFormat();
loadSymbolsMeta();
setAuto(true);
load(false);
})();
</script>
</body>
</html>
